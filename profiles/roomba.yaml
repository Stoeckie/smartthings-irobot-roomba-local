name: roomba
components:
  - id: main
    capabilities:
      - id: robotCleanerMovement
        version: 1
      - id: switch
        version: 1
      - id: silvervalley08660.robotFavorites
        version: 1
      - id: silvervalley08660.robotBin
        version: 1
      - id: battery
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: RobotCleaner
  - id: connection
    label: Connection
    capabilities:
      - id: silvervalley08660.connectionStatus
        version: 1
      - id: silvervalley08660.connectionLog
        version: 1
preferences:
  - name: ipAddress
    title: Robot IP (optional)
    description: Leave on "auto" (found on the network). Set a fixed IP when discovery fails.
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "auto"
  - name: password
    title: Robot password (optional)
    description: Leave empty. The hub fetches it itself when you hold HOME on the docked robot for 2 seconds. Only paste one here if you already have it from another tool.
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: ""
  - name: resetPassword
    title: Forget password
    description: Switch on to forget the stored password (then hold HOME again).
    required: false
    preferenceType: boolean
    definition:
      default: false
  - name: bridgeAddress
    title: Stoeckie Bridge IP (optional)
    description: For favorite names from your iRobot account. "auto" finds the bridge on the network, "off" uses only learned favorites.
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "auto"
  - name: favoriteNames
    title: Favorite names
    description: Only without a bridge. Comma separated, in the order learned (start each favorite once in the iRobot app), e.g. "Kamer, Hele keuken".
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: ""
  - name: resetFavorites
    title: Forget learned favorites
    description: Switch on to clear the list, then start your favorites again in the iRobot app.
    required: false
    preferenceType: boolean
    definition:
      default: false
